<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations Dashboard — Del Bravo Trade & SoM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:#0d1117;font-family:Calibri,Arial,sans-serif;color:#c9d1d9;}

.dash{
  padding:6px 10px;
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  gap:5px;
}

.topbar{display:flex;justify-content:space-between;align-items:center;}
.topbar-title{font-size:12px;font-weight:700;color:#c9d1d9;text-transform:uppercase;letter-spacing:.06em;}
.topbar-info{font-size:11px;color:#8b949e;}

.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;}
.panel{background:#161b22;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;height:100%;}

.panel-hdr{padding:5px 12px;flex-shrink:0;}
.panel-hdr.dbt{background:#1D4ED8;}
.panel-hdr.som{background:#6D28D9;}
.panel-hdr span{font-size:16px;font-weight:700;color:#fff;}

.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);flex-shrink:0;border-bottom:1px solid #30363d;}
.kpi{padding:4px;text-align:center;border-right:1px solid #30363d;}
.kpi:last-child{border-right:none;}
.kpi-label{font-size:9px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;}
.kpi-val{font-size:26px;font-weight:700;line-height:1;}
.kpi-val.total{color:#e6edf3;}
.kpi-val.sent{color:#3fb950;}
.kpi-val.pending{color:#f85149;}
.kpi-val.process{color:#d29922;}

.sec-title{
  font-size:13px;font-weight:700;color:#c9d1d9;
  text-transform:uppercase;letter-spacing:.08em;
  padding:4px 8px;
  background:#1a2030;
  border-top:1px solid #30363d;
  border-bottom:1px solid #30363d;
  flex-shrink:0;
}

/* ORDERS TABLE — fills remaining space with empty rows */
.orders-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
.tbl th{font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;padding:3px 7px;background:#0d1117;border-bottom:1px solid #3a3f47;text-align:left;}
.tbl td{padding:3px 7px;border-bottom:1px solid #2d333b;color:#c9d1d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tbl tr:nth-child(odd)  td{background:#1c2128;}
.tbl tr:nth-child(even) td{background:#161b22;}


.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;}
.b-pend{background:#3d1a1a;color:#f85149;}
.b-proc{background:#3d2e0a;color:#d29922;}
.days-late{color:#f85149;font-weight:700;}
.days-ok  {color:#3fb950;font-weight:700;}

/* CLIENT TABLE — fixed at bottom of panel */
.client-tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;flex-shrink:0;}
.client-tbl th{font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;padding:3px 7px;background:#0d1117;border-bottom:1px solid #3a3f47;text-align:center;}
.client-tbl th:first-child{text-align:left;}
.client-tbl td{padding:3px 7px;border-bottom:1px solid #2d333b;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-tbl tr:last-child td{border-bottom:none;}
.client-tbl tr:nth-child(odd)  td{background:#1c2128;}
.client-tbl tr:nth-child(even) td{background:#161b22;}
.client-tbl td:first-child{text-align:left;color:#e6edf3;}

/* CHART SECTION */
.chart-section{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chart-block{background:#161b22;border-radius:6px;overflow:hidden;}
.chart-inner{display:flex;align-items:center;justify-content:center;gap:28px;padding:8px 20px;}
canvas.donut{width:120px!important;height:120px!important;}
.legend{font-size:13px;}
.legend-item{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.legend-dot{width:13px;height:13px;border-radius:2px;flex-shrink:0;}
.legend-label{color:#8b949e;flex:1;}
.legend-val{font-weight:700;min-width:26px;text-align:right;font-size:17px;}

.footer{font-size:8px;color:#484f58;text-align:center;}
</style>
</head>
<body>
<div class="dash">

  <div class="topbar">
    <span class="topbar-title">Operations Dashboard — Del Bravo Trade &amp; Specialties of Mexico</span>
    <span class="topbar-info" id="ti">Cargando...</span>
  </div>

  <div class="panels" id="panels">
    <div style="display:flex;align-items:center;justify-content:center;color:#484f58;font-size:12px;">Cargando DBT...</div>
    <div style="display:flex;align-items:center;justify-content:center;color:#484f58;font-size:12px;">Cargando SoM...</div>
  </div>

  <div class="chart-section" id="charts" style="display:none;">
    <div class="chart-block">
      <div class="sec-title">Distribución de Órdenes — Del Bravo Trade</div>
      <div class="chart-inner">
        <canvas class="donut" id="dbt-donut" role="img" aria-label="Distribución DBT"></canvas>
        <div class="legend" id="dbt-legend"></div>
      </div>
    </div>
    <div class="chart-block">
      <div class="sec-title">Distribución de Órdenes — Specialties of Mexico</div>
      <div class="chart-inner">
        <canvas class="donut" id="som-donut" role="img" aria-label="Distribución SoM"></canvas>
        <div class="legend" id="som-legend"></div>
      </div>
    </div>
  </div>

  <div class="footer" id="footer"></div>
</div>

<script>
const URL_DBT='https://docs.google.com/spreadsheets/d/e/2PACX-1vQMpWqX2-iTCv7zaSGYC0qTv1ThdAMmUmVMVJGw6zUgBxIy2SldaFWVdz0umVTVDiaF7n5JGQl2Urs5/pub?gid=1175753568&single=true&output=csv';
const URL_SOM='https://docs.google.com/spreadsheets/d/e/2PACX-1vQMpWqX2-iTCv7zaSGYC0qTv1ThdAMmUmVMVJGw6zUgBxIy2SldaFWVdz0umVTVDiaF7n5JGQl2Urs5/pub?gid=705772395&single=true&output=csv';
const MAX_ORDERS = 10;

function splitLine(l){const r=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q;}else if(ch===','&&!q){r.push(c);c='';}else c+=ch;}r.push(c);return r;}

function parseCSV(txt){
  const lines=txt.trim().split('\n');
  const hi=lines.findIndex(l=>l.toLowerCase().includes('cliente'));
  if(hi<0)return[];
  const hdrs=splitLine(lines[hi]).map(h=>h.trim().replace(/^"|"$/g,''));
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    const v=splitLine(lines[i]).map(x=>x.trim().replace(/^"|"$/g,''));
    if(v.length<2)continue;
    const row={};hdrs.forEach((h,idx)=>row[h]=v[idx]||'');
    if(row['Cliente']&&row['Cliente']!=='Cliente')rows.push(row);
  }
  return rows;
}

function ns(s){
  if(!s)return'';const l=s.toLowerCase().trim();
  if(l==='enviado')return'Enviado';
  if(l==='pendiente')return'Pendiente';
  if(l.includes('proceso'))return'En proceso';
  return s;
}
function gf(row,...keys){for(const k of keys)if(row[k]!==undefined&&row[k]!=='')return row[k];return'';}

function buildKPIs(rows){
  const t=rows.length,
        e=rows.filter(r=>ns(r['Estado'])==='Enviado').length,
        p=rows.filter(r=>ns(r['Estado'])==='Pendiente').length,
        pr=rows.filter(r=>ns(r['Estado'])==='En proceso').length;
  return`<div class="kpi-strip">
    <div class="kpi"><div class="kpi-label">Total</div><div class="kpi-val total">${t}</div></div>
    <div class="kpi"><div class="kpi-label">Enviados</div><div class="kpi-val sent">${e}</div></div>
    <div class="kpi"><div class="kpi-label">Pendientes</div><div class="kpi-val pending">${p}</div></div>
    <div class="kpi"><div class="kpi-label">En proceso</div><div class="kpi-val process">${pr}</div></div>
  </div>`;}

function buildOrders(rows){
  const active=rows.filter(r=>ns(r['Estado'])!=='Enviado').slice(0,MAX_ORDERS);
  const cols = `<colgroup>
    <col style="width:90px"><col style="width:130px"><col style="width:78px">
    <col style="width:78px"><col style="width:90px"><col style="width:52px"><col style="width:90px">
  </colgroup>`;
  let h=`<div class="sec-title">Órdenes Activas</div>
  <div class="orders-wrap">
  <table class="tbl">${cols}
    <thead><tr><th>PO #</th><th>Cliente</th><th>F.Pedido</th><th>Vence</th><th>Destino</th><th>Días</th><th>Estado</th></tr></thead>
    <tbody>`;
  active.forEach(r=>{
    const dr=gf(r,'Días Restantes','Dias Restantes');
    const d=parseInt(dr);
    const ds=isNaN(d)||dr===''?'':(d<0?`<span class="days-late">${d}d</span>`:`<span class="days-ok">+${d}d</span>`);
    const st=ns(r['Estado']);
    const bg=st==='En proceso'?`<span class="badge b-proc">En proceso</span>`:`<span class="badge b-pend">Pendiente</span>`;
    h+=`<tr>
      <td>${gf(r,'PO #','PO#')}</td><td>${r['Cliente']||''}</td>
      <td>${gf(r,'Fecha Pedido','F. Pedido')}</td>
      <td>${gf(r,'Fecha Vencimiento','F. Venc.')}</td>
      <td>${r['Destino']||''}</td><td>${ds}</td><td>${bg}</td>
    </tr>`;
  });

  h+='</tbody></table></div>';
  return h;}

function buildClients(rows){
  const m={};
  rows.forEach(r=>{
    const c=(r['Cliente']||'').trim();if(!c)return;
    if(!m[c])m[c]={t:0,e:0,p:0,pr:0};
    const s=ns(r['Estado']);m[c].t++;
    if(s==='Enviado')m[c].e++;
    if(s==='Pendiente')m[c].p++;
    if(s==='En proceso')m[c].pr++;
  });
  let h=`<div class="sec-title">Por Cliente</div>
  <table class="client-tbl">
    <colgroup>
      <col style="width:130px"><col style="width:40px"><col style="width:40px">
      <col style="width:50px"><col style="width:50px"><col style="width:65px">
    </colgroup>
    <thead><tr>
      <th>Cliente</th><th>Tot</th>
      <th style="color:#3fb950">Env</th>
      <th style="color:#f85149">Pend</th>
      <th style="color:#d29922">Proc</th>
      <th>% Compl.</th>
    </tr></thead><tbody>`;
  Object.entries(m).forEach(([c,d])=>{
    const pct=d.t>0?Math.round(d.e/d.t*100):0;
    const pc=pct===100?'#3fb950':pct>0?'#d29922':'#f85149';
    h+=`<tr>
      <td>${c}</td><td>${d.t}</td>
      <td style="color:#3fb950">${d.e}</td>
      <td style="color:#f85149">${d.p}</td>
      <td style="color:#d29922">${d.pr}</td>
      <td style="color:${pc};font-weight:700">${pct}%</td>
    </tr>`;
  });
  return h+'</tbody></table>';}

const _charts={};
function buildDonut(cid,lid,rows){
  const e=rows.filter(r=>ns(r['Estado'])==='Enviado').length;
  const p=rows.filter(r=>ns(r['Estado'])==='Pendiente').length;
  const pr=rows.filter(r=>ns(r['Estado'])==='En proceso').length;
  if(_charts[cid]){_charts[cid].destroy();delete _charts[cid];}
  _charts[cid]=new Chart(document.getElementById(cid).getContext('2d'),{
    type:'doughnut',
    data:{datasets:[{data:[e,p,pr],backgroundColor:['#3fb950','#f85149','#d29922'],borderWidth:2,borderColor:'#161b22'}]},
    options:{responsive:false,plugins:{legend:{display:false},tooltip:{enabled:false}},cutout:'60%'}
  });
  document.getElementById(lid).innerHTML=`
    <div class="legend-item"><span class="legend-dot" style="background:#3fb950"></span><span class="legend-label">Enviado</span><span class="legend-val" style="color:#3fb950">${e}</span></div>
    <div class="legend-item"><span class="legend-dot" style="background:#f85149"></span><span class="legend-label">Pendiente</span><span class="legend-val" style="color:#f85149">${p}</span></div>
    <div class="legend-item"><span class="legend-dot" style="background:#d29922"></span><span class="legend-label">En proceso</span><span class="legend-val" style="color:#d29922">${pr}</span></div>`;}

function buildPanel(rows,company,cls){
  return`<div class="panel">
    <div class="panel-hdr ${cls}"><span>${company}</span></div>
    ${buildKPIs(rows)}
    ${buildOrders(rows)}
    ${buildClients(rows)}
  </div>`;}

async function init(){
  try{
    const [cD,cS]=await Promise.all([
      fetch(URL_DBT).then(r=>r.text()),
      fetch(URL_SOM).then(r=>r.text())
    ]);
    const rD=parseCSV(cD),rS=parseCSV(cS);
    document.getElementById('panels').innerHTML=
      buildPanel(rD,'Del Bravo Trade, LLC','dbt')+
      buildPanel(rS,'Specialties of Mexico (SoM)','som');
    document.getElementById('charts').style.display='grid';
    buildDonut('dbt-donut','dbt-legend',rD);
    buildDonut('som-donut','som-legend',rS);
    const f=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
    document.getElementById('ti').textContent=`Actualizado: ${f}  |  DBT: ${rD.length} órdenes  |  SoM: ${rS.length} órdenes`;
    document.getElementById('footer').textContent='Datos en tiempo real desde Google Sheets — se actualiza cada 30 segundos';
  }catch(e){
    document.getElementById('panels').innerHTML=
      `<div style="display:flex;align-items:center;justify-content:center;color:#f85149;font-size:13px;grid-column:span 2">Error: ${e.message}</div>`;
  }
}
init();
setInterval(()=>location.reload(),30000);
</script>
</body>
</html>
