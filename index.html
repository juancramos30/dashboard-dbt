<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations Dashboard — Del Bravo Trade & SoM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:#0d1117;font-family:Calibri,Arial,sans-serif;color:#c9d1d9;}
.dash{padding:6px 10px;height:100vh;display:flex;flex-direction:column;gap:5px;}

/* TOP BAR */
.topbar{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.topbar-title{font-size:11px;font-weight:700;color:#c9d1d9;text-transform:uppercase;letter-spacing:.06em;}
.topbar-info{font-size:10px;color:#8b949e;}

/* TWO PANELS */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0;}
.panel{background:#161b22;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;}

/* PANEL HEADER */
.panel-hdr{padding:5px 12px;flex-shrink:0;}
.panel-hdr.dbt{background:#1D4ED8;}
.panel-hdr.som{background:#6D28D9;}
.panel-hdr span{font-size:14px;font-weight:700;color:#fff;}

/* KPI STRIP */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);background:#161b22;border-bottom:1px solid #21262d;flex-shrink:0;}
.kpi{padding:4px;text-align:center;border-right:1px solid #21262d;}
.kpi:last-child{border-right:none;}
.kpi-label{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;}
.kpi-val{font-size:24px;font-weight:700;line-height:1;}
.kpi-val.total{color:#e6edf3;}
.kpi-val.sent{color:#3fb950;}
.kpi-val.pending{color:#f85149;}
.kpi-val.process{color:#d29922;}

/* SECTION TITLE */
.sec-title{font-size:9px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;background:#0d1117;border-bottom:1px solid #21262d;flex-shrink:0;}

/* ORDERS TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed;}
.tbl th{font-size:8px;font-weight:700;color:#484f58;text-transform:uppercase;padding:3px 6px;background:#161b22;border-bottom:1px solid #21262d;text-align:left;}
.tbl td{padding:3px 6px;border-bottom:1px solid #21262d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:nth-child(odd) td{background:#1c2128;}
.tbl tr:nth-child(even) td{background:#161b22;}
.badge{display:inline-block;padding:1px 6px;border-radius:5px;font-size:9px;font-weight:700;}
.b-pend{background:#3d1a1a;color:#f85149;}
.b-proc{background:#3d2e0a;color:#d29922;}
.days-late{color:#f85149;font-weight:700;}
.days-ok{color:#3fb950;font-weight:700;}

/* CLIENT TABLE */
.client-tbl{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed;}
.client-tbl th{font-size:8px;font-weight:700;color:#484f58;text-transform:uppercase;padding:3px 6px;background:#0d1117;border-bottom:1px solid #21262d;text-align:center;}
.client-tbl th:first-child{text-align:left;}
.client-tbl td{padding:3px 6px;border-bottom:1px solid #21262d;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-tbl tr:last-child td{border-bottom:none;}
.client-tbl tr:nth-child(odd) td{background:#1c2128;}
.client-tbl tr:nth-child(even) td{background:#161b22;}
.client-tbl td:first-child{text-align:left;color:#e6edf3;}

/* CHART SECTION */
.chart-section{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex-shrink:0;}
.chart-block{background:#161b22;border-radius:6px;overflow:hidden;}
.chart-inner{display:flex;align-items:center;justify-content:center;gap:20px;padding:8px 16px;}
canvas.donut{width:90px!important;height:90px!important;}
.legend{font-size:11px;}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.legend-dot{width:12px;height:12px;border-radius:2px;flex-shrink:0;}
.legend-label{color:#8b949e;flex:1;}
.legend-val{font-weight:700;min-width:24px;text-align:right;font-size:13px;}

/* FOOTER */
.footer{font-size:8px;color:#484f58;text-align:center;flex-shrink:0;}
</style>
</head>
<body>
<div class="dash">
  <div class="topbar">
    <span class="topbar-title">Operations Dashboard — Del Bravo Trade &amp; Specialties of Mexico</span>
    <span class="topbar-info" id="topbar-info">Cargando...</span>
  </div>

  <div class="panels" id="panels">
    <div style="display:flex;align-items:center;justify-content:center;color:#484f58;font-size:12px;">Cargando DBT...</div>
    <div style="display:flex;align-items:center;justify-content:center;color:#484f58;font-size:12px;">Cargando SoM...</div>
  </div>

  <div class="chart-section" id="charts" style="display:none;">
    <div class="chart-block">
      <div class="sec-title">DISTRIBUCIÓN DE ÓRDENES — DEL BRAVO TRADE</div>
      <div class="chart-inner">
        <canvas class="donut" id="dbt-donut" role="img" aria-label="Distribución DBT"></canvas>
        <div class="legend" id="dbt-legend"></div>
      </div>
    </div>
    <div class="chart-block">
      <div class="sec-title">DISTRIBUCIÓN DE ÓRDENES — SPECIALTIES OF MEXICO</div>
      <div class="chart-inner">
        <canvas class="donut" id="som-donut" role="img" aria-label="Distribución SoM"></canvas>
        <div class="legend" id="som-legend"></div>
      </div>
    </div>
  </div>

  <div class="footer" id="footer"></div>
</div>

<script>
const URL_DBT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMpWqX2-iTCv7zaSGYC0qTv1ThdAMmUmVMVJGw6zUgBxIy2SldaFWVdz0umVTVDiaF7n5JGQl2Urs5/pub?gid=1175753568&single=true&output=csv';
const URL_SOM = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMpWqX2-iTCv7zaSGYC0qTv1ThdAMmUmVMVJGw6zUgBxIy2SldaFWVdz0umVTVDiaF7n5JGQl2Urs5/pub?gid=705772395&single=true&output=csv';
const MAX_ORDERS = 10;

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const hIdx = lines.findIndex(l => l.includes('Cliente') || l.includes('cliente'));
  if (hIdx < 0) return [];
  const headers = lines[hIdx].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  const rows = [];
  for (let i = hIdx+1; i < lines.length; i++) {
    const vals = splitCSVLine(lines[i]);
    if (vals.length < 2) continue;
    const row = {};
    headers.forEach((h,idx) => row[h] = (vals[idx]||'').trim().replace(/^"|"$/g,''));
    if (row['Cliente'] && row['Cliente'] !== 'Cliente') rows.push(row);
  }
  return rows;
}

function splitCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let c of line) {
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

function normStatus(s) {
  if (!s) return '';
  const l = s.toLowerCase().trim();
  if (l === 'enviado') return 'Enviado';
  if (l === 'pendiente') return 'Pendiente';
  if (l.includes('proceso')) return 'En proceso';
  return s;
}

function getField(row, ...keys) {
  for (const k of keys) if (row[k] !== undefined && row[k] !== '') return row[k];
  return '';
}

function buildKPIs(rows) {
  const total    = rows.length;
  const enviado  = rows.filter(r => normStatus(r['Estado']) === 'Enviado').length;
  const pendiente= rows.filter(r => normStatus(r['Estado']) === 'Pendiente').length;
  const proceso  = rows.filter(r => normStatus(r['Estado']) === 'En proceso').length;
  return `<div class="kpi-strip">
    <div class="kpi"><div class="kpi-label">Total</div><div class="kpi-val total">${total}</div></div>
    <div class="kpi"><div class="kpi-label">Enviados</div><div class="kpi-val sent">${enviado}</div></div>
    <div class="kpi"><div class="kpi-label">Pendientes</div><div class="kpi-val pending">${pendiente}</div></div>
    <div class="kpi"><div class="kpi-label">En proceso</div><div class="kpi-val process">${proceso}</div></div>
  </div>`;
}

function buildOrders(rows) {
  const active = rows.filter(r => normStatus(r['Estado']) !== 'Enviado').slice(0, MAX_ORDERS);
  let html = `<div class="sec-title">ÓRDENES ACTIVAS</div>
  <table class="tbl">
    <colgroup><col style="width:90px"><col style="width:130px"><col style="width:80px"><col style="width:80px"><col style="width:95px"><col style="width:55px"><col style="width:90px"></colgroup>
    <thead><tr>
      <th>PO #</th><th>Cliente</th><th>F. Pedido</th><th>Vence</th><th>Destino</th><th>Días</th><th>Estado</th>
    </tr></thead><tbody>`;
  active.forEach(r => {
    const diasRaw = getField(r,'Días Restantes','Dias Restantes','DÃ­as Restantes');
    const dias = parseInt(diasRaw);
    const diaStr = isNaN(dias)||diasRaw==='' ? '' :
      (dias < 0 ? `<span class="days-late">${dias}d</span>` : `<span class="days-ok">+${dias}d</span>`);
    const st = normStatus(r['Estado']);
    const badge = st === 'En proceso'
      ? `<span class="badge b-proc">En proceso</span>`
      : `<span class="badge b-pend">Pendiente</span>`;
    const fp = getField(r,'Fecha Pedido','F. Pedido');
    const fv = getField(r,'Fecha Vencimiento','F. Venc.','Fecha VencimientoFecha Vencimiento');
    const po = getField(r,'PO #','PO#','# PO');
    html += `<tr>
      <td>${po}</td><td>${r['Cliente']||''}</td>
      <td>${fp}</td><td>${fv}</td>
      <td>${r['Destino']||''}</td>
      <td>${diaStr}</td><td>${badge}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  return html;
}

function buildClients(rows) {
  const map = {};
  rows.forEach(r => {
    const cli = (r['Cliente']||'').trim();
    if (!cli) return;
    if (!map[cli]) map[cli]={total:0,enviado:0,pendiente:0,proceso:0};
    const st = normStatus(r['Estado']);
    map[cli].total++;
    if (st==='Enviado')    map[cli].enviado++;
    if (st==='Pendiente')  map[cli].pendiente++;
    if (st==='En proceso') map[cli].proceso++;
  });
  let html = `<div class="sec-title">POR CLIENTE</div>
  <table class="client-tbl">
    <colgroup><col style="width:130px"><col style="width:40px"><col style="width:40px"><col style="width:50px"><col style="width:50px"><col style="width:65px"></colgroup>
    <thead><tr><th>Cliente</th><th>Tot</th><th style="color:#3fb950">Env</th><th style="color:#f85149">Pend</th><th style="color:#d29922">Proc</th><th>% Compl.</th></tr></thead>
    <tbody>`;
  Object.entries(map).forEach(([cli,d]) => {
    const pct = d.total > 0 ? Math.round(d.enviado/d.total*100) : 0;
    const pc = pct===100?'#3fb950':pct>0?'#d29922':'#f85149';
    html += `<tr>
      <td>${cli}</td><td>${d.total}</td>
      <td style="color:#3fb950">${d.enviado}</td>
      <td style="color:#f85149">${d.pendiente}</td>
      <td style="color:#d29922">${d.proceso}</td>
      <td style="color:${pc};font-weight:700">${pct}%</td>
    </tr>`;
  });
  html += '</tbody></table>';
  return html;
}

function buildDonut(canvasId, legendId, rows) {
  const env  = rows.filter(r => normStatus(r['Estado'])==='Enviado').length;
  const pend = rows.filter(r => normStatus(r['Estado'])==='Pendiente').length;
  const proc = rows.filter(r => normStatus(r['Estado'])==='En proceso').length;
  const ctx = document.getElementById(canvasId).getContext('2d');
  new Chart(ctx, {
    type:'doughnut',
    data:{ datasets:[{ data:[env,pend,proc], backgroundColor:['#3fb950','#f85149','#d29922'], borderWidth:2, borderColor:'#161b22' }] },
    options:{ responsive:false, plugins:{ legend:{display:false}, tooltip:{enabled:false} }, cutout:'65%' }
  });
  document.getElementById(legendId).innerHTML = `
    <div class="legend-item"><span class="legend-dot" style="background:#3fb950"></span><span class="legend-label">Enviado</span><span class="legend-val" style="color:#3fb950">${env}</span></div>
    <div class="legend-item"><span class="legend-dot" style="background:#f85149"></span><span class="legend-label">Pendiente</span><span class="legend-val" style="color:#f85149">${pend}</span></div>
    <div class="legend-item"><span class="legend-dot" style="background:#d29922"></span><span class="legend-label">En proceso</span><span class="legend-val" style="color:#d29922">${proc}</span></div>`;
}

function buildPanel(rows, company, cls) {
  return `<div class="panel">
    <div class="panel-hdr ${cls}"><span>${company}</span></div>
    ${buildKPIs(rows)}
    ${buildOrders(rows)}
    ${buildClients(rows)}
  </div>`;
}

let chartDBT=null, chartSOM=null;

async function init() {
  try {
    const [csvDBT, csvSOM] = await Promise.all([
      fetch(URL_DBT).then(r=>r.text()),
      fetch(URL_SOM).then(r=>r.text())
    ]);
    const rowsDBT = parseCSV(csvDBT);
    const rowsSOM = parseCSV(csvSOM);

    document.getElementById('panels').innerHTML =
      buildPanel(rowsDBT,'Del Bravo Trade, LLC','dbt') +
      buildPanel(rowsSOM,'Specialties of Mexico (SoM)','som');

    document.getElementById('charts').style.display = 'grid';
    if(chartDBT) chartDBT.destroy();
    if(chartSOM) chartSOM.destroy();
    buildDonut('dbt-donut','dbt-legend',rowsDBT);
    buildDonut('som-donut','som-legend',rowsSOM);

    const now = new Date();
    const fecha = now.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
    document.getElementById('topbar-info').textContent =
      `Actualizado: ${fecha}  |  DBT: ${rowsDBT.length} órdenes  |  SoM: ${rowsSOM.length} órdenes`;
    document.getElementById('footer').textContent =
      `Datos en tiempo real desde Google Sheets — se actualiza automáticamente cada 5 minutos`;
  } catch(e) {
    document.getElementById('panels').innerHTML =
      `<div style="display:flex;align-items:center;justify-content:center;color:#f85149;font-size:12px;grid-column:span 2">Error: ${e.message}</div>`;
  }
}

init();
setInterval(init, 300000);
</script>
</body>
</html>
