<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist del Día — En Vivo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;}
body{background:#0d1117;font-family:Calibri,Arial,sans-serif;color:#c9d1d9;display:flex;justify-content:center;}
.wrap{width:100%;max-width:640px;padding:16px;}

.topbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;}
.topbar h1{font-size:22px;font-weight:700;color:#e6edf3;text-transform:uppercase;letter-spacing:.05em;}
.live-dot{width:10px;height:10px;border-radius:50%;background:#3fb950;flex-shrink:0;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.warn{background:#3d2e0a;color:#d29922;border:1px solid #5a4615;border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;}

.add-form{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.add-form input{flex:1;min-width:120px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:10px 12px;font-size:14px;}
.add-form input:focus{outline:none;border-color:#1D4ED8;}
.add-form button{background:#1D4ED8;color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;}
.add-form button:hover{background:#2563eb;}
.add-form button:disabled{background:#30363d;cursor:not-allowed;}

.list{background:#161b22;border-radius:8px;overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #21262d;}
.row:last-child{border-bottom:none;}
.row-num{font-size:13px;color:#8b949e;font-weight:700;min-width:22px;}
.row-info{flex:1;min-width:0;}
.row-title{font-size:15px;font-weight:700;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-artist{font-size:13px;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-del{background:none;border:none;color:#f85149;font-size:18px;font-weight:700;cursor:pointer;padding:4px 8px;line-height:1;}
.row-del:hover{color:#ff7b72;}

.empty{padding:40px 16px;text-align:center;color:#484f58;font-size:14px;}
.footer{font-size:11px;color:#484f58;text-align:center;margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="live-dot"></span>
    <h1>Playlist del Día</h1>
  </div>

  <div class="warn" id="warn">
    ⚠ Firebase no está configurado todavía. Reemplaza <code>firebaseConfig</code> en el código con las credenciales de tu proyecto (console.firebase.google.com).
  </div>

  <form class="add-form" id="add-form">
    <input type="text" id="in-title" placeholder="Título de la canción" maxlength="80" required>
    <input type="text" id="in-artist" placeholder="Artista" maxlength="60" required>
    <button type="submit" id="add-btn">Agregar</button>
  </form>

  <div class="list" id="list">
    <div class="empty">Cargando playlist...</div>
  </div>

  <div class="footer">Lista compartida en vivo — cualquiera puede agregar o quitar canciones</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, push, remove, onValue, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// TODO: reemplaza con la configuración de tu propio proyecto Firebase
// (Firebase Console > Project settings > General > Your apps > SDK setup and configuration)
const firebaseConfig = {
  apiKey: "TODO_API_KEY",
  authDomain: "TODO_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://TODO_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "TODO_PROJECT_ID",
};

const isConfigured = !Object.values(firebaseConfig).some(v => v.startsWith("TODO_"));

const listEl = document.getElementById('list');
const warnEl = document.getElementById('warn');
const formEl = document.getElementById('add-form');
const titleInput = document.getElementById('in-title');
const artistInput = document.getElementById('in-artist');
const addBtn = document.getElementById('add-btn');

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(songs){
  if(!songs.length){
    listEl.innerHTML = '<div class="empty">Aún no hay canciones. ¡Agrega la primera!</div>';
    return;
  }
  listEl.innerHTML = songs.map((s, i) => `
    <div class="row">
      <span class="row-num">${i + 1}</span>
      <div class="row-info">
        <div class="row-title">${escapeHtml(s.title)}</div>
        <div class="row-artist">${escapeHtml(s.artist)}</div>
      </div>
      <button class="row-del" data-id="${s.id}" title="Quitar">×</button>
    </div>
  `).join('');
}

if(!isConfigured){
  warnEl.style.display = 'block';
  listEl.innerHTML = '<div class="empty">Configura Firebase para activar la playlist en vivo.</div>';
  addBtn.disabled = true;
}else{
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const playlistRef = ref(db, 'playlist');

  onValue(playlistRef, snapshot => {
    const data = snapshot.val() || {};
    const songs = Object.entries(data)
      .map(([id, v]) => ({ id, ...v }))
      .sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
    render(songs);
  }, err => {
    listEl.innerHTML = `<div class="empty">Error de conexión: ${escapeHtml(err.message)}</div>`;
  });

  listEl.addEventListener('click', e => {
    const btn = e.target.closest('.row-del');
    if(!btn) return;
    remove(ref(db, `playlist/${btn.dataset.id}`));
  });

  formEl.addEventListener('submit', e => {
    e.preventDefault();
    const title = titleInput.value.trim();
    const artist = artistInput.value.trim();
    if(!title || !artist) return;
    push(playlistRef, { title, artist, addedAt: serverTimestamp() });
    titleInput.value = '';
    artistInput.value = '';
    titleInput.focus();
  });
}
</script>
</body>
</html>
