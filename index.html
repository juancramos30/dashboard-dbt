<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{background:#0d1117;font-family:Calibri,Arial,sans-serif;color:#c9d1d9;display:flex;align-items:center;justify-content:center;}
.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;padding:20px;}
.card{background:#161b22;border-radius:10px;padding:32px 28px;width:240px;text-align:center;text-decoration:none;color:#e6edf3;border:1px solid #30363d;transition:border-color .15s;}
.card:hover{border-color:#1D4ED8;}
.card h2{font-size:18px;font-weight:700;margin-bottom:8px;}
.card p{font-size:13px;color:#8b949e;}
</style>
</head>
<body>
<div class="cards">
  <a class="card" href="playlist/">
    <h2>🎵 Playlist del Día</h2>
    <p>Lista de canciones compartida en vivo</p>
  </a>
  <a class="card" href="dashboard/">
    <h2>📊 Operations Dashboard</h2>
    <p>Pedidos DBT &amp; SoM en tiempo real</p>
  </a>
</div>
</body>
</html>
